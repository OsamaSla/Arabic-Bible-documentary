<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المستندات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t !== 'dark' && t !== 'light') {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
    })();
    </script>
    <style>
        .admin-container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding: 1rem; background: var(--bg-light); border-radius: var(--radius-md); flex-wrap: wrap; gap: 0.5rem; }
        .admin-header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .doc-item { min-height: 72px; padding: 14px; border: 1px solid #ddd; margin: 8px 0; border-radius: 6px; background: #fff; cursor: pointer; }
        .doc-item:hover { border-color: var(--color-primary); }
        .doc-item:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
        .doc-item.hidden-doc { opacity: 0.65; border-style: dashed; }
        .admin-btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.95rem; }
        .admin-btn-primary { background: #007bff; color: white; }
        .admin-btn-danger { background: #dc3545; color: white; }
        .login-form { max-width: 400px; margin: 50px auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .filter-buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.4rem 0.8rem; border: 1px solid #ddd; background: #f8f9fa; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
        .filter-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
        .filter-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            margin: 4px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
        }
        .status-badge.completed-on { background: #28a745; color: #fff; }
        .status-badge.completed-off { background: #e9ecef; color: #495057; }
        .status-badge.hidden-on { background: #6c757d; color: #fff; }
        .status-badge.hidden-off { background: #e9ecef; color: #495057; opacity: 0.55; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">تخطي إلى المحتوى الرئيسي</a>
    <header class="site-header">
        <div class="header-top"><div class="container">
            <a href="index.html" class="logo">
                <span class="cross">&#10013;</span>
                <span class="logo-text">Arabic Christian Documentary Translations</span>
            </a>
            <div class="header-actions">
                <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="تبديل المظهر">
                    <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
                    <span class="theme-icon-sun" aria-hidden="true">&#9728;</span>
                </button>
            </div>
        </div></div>
    </header>

    <main id="main-content" class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <div class="admin-header-actions">
                <button class="admin-btn admin-btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="loginSection" class="login-form" style="display: none;">
            <h2>Login Required</h2>
            <p>You must login to access the admin panel.</p>
            <button class="admin-btn admin-btn-primary" onclick="window.location.href='admin.html'">Go to Login</button>
        </div>

        <div id="adminContent" style="display: none;">
            <h2>Document Status</h2>
            <p>Read-only view. Status comes from source folders: <strong>تم</strong> = completed, <strong>hidden</strong> / <strong>مخفي</strong> = hidden.</p>

            <input type="text" id="filterBox" placeholder="Search docs..." style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ddd; border-radius:4px;">

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all" id="btnAll">الكل (All)</button>
                <button class="filter-btn" data-filter="completed" id="btnCompleted">مكتمل (Completed)</button>
                <button class="filter-btn" data-filter="hidden" id="btnHidden">مخفي (Hidden)</button>
            </div>

            <div id="docsContainer">
                <p>Loading documents...</p>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script>
            const storageKey = 'admin_logged_in';
            let currentSearchQuery = '';
            let filterCompletedActive = false;
            let filterHiddenActive = false;

            function isLoggedIn() {
                try {
                    return localStorage.getItem(storageKey) === 'true';
                } catch (e) {
                    return false;
                }
            }

            function logout() {
                try {
                    localStorage.removeItem(storageKey);
                } catch (e) {}
                window.location.href = 'admin.html';
            }

        function loadDocuments() {
            if (window.__DOCUMENTS_DATA__) {
                var docs = window.__DOCUMENTS_DATA__;
                window.__allDocs = docs;
                applyFiltersAndRender();
                setupControls();
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'documents/index.json', false);
            try {
                xhr.send();
            } catch (e) {
                document.getElementById('docsContainer').innerHTML = '<p>Error loading documents: ' + e.message + '</p>';
                return;
            }

            if (xhr.status !== 200 && xhr.status !== 0) {
                document.getElementById('docsContainer').innerHTML = '<p>Error loading documents (Status: ' + xhr.status + ')</p>';
                return;
            }

            try {
                var data = JSON.parse(xhr.responseText);
                var docs = data.documents || [];
                window.__allDocs = docs;
                applyFiltersAndRender();
                setupControls();
            } catch (err) {
                document.getElementById('docsContainer').innerHTML = '<p>Error parsing documents: ' + err.message + '</p>';
            }
        }

        function setupControls() {
            var filterBox = document.getElementById('filterBox');
            if (!filterBox._listenerAdded) {
                filterBox._listenerAdded = true;
                filterBox.addEventListener('input', function(e) {
                    currentSearchQuery = e.target.value.toLowerCase();
                    applyFiltersAndRender();
                });
            }

            var btnAll = document.getElementById('btnAll');
            var btnCompleted = document.getElementById('btnCompleted');
            var btnHidden = document.getElementById('btnHidden');

            if (!btnAll._listenerAdded) {
                btnAll._listenerAdded = true;
                btnAll.addEventListener('click', function() {
                    if (btnAll.classList.contains('active')) {
                        btnAll.classList.remove('active');
                    } else {
                        btnAll.classList.add('active');
                        filterCompletedActive = false;
                        filterHiddenActive = false;
                        btnCompleted.classList.remove('active');
                        btnHidden.classList.remove('active');
                    }
                    applyFiltersAndRender();
                });
            }

            if (!btnCompleted._listenerAdded) {
                btnCompleted._listenerAdded = true;
                btnCompleted.addEventListener('click', function() {
                    filterCompletedActive = !filterCompletedActive;
                    if (filterCompletedActive) {
                        btnCompleted.classList.add('active');
                        btnAll.classList.remove('active');
                    } else {
                        btnCompleted.classList.remove('active');
                    }
                    applyFiltersAndRender();
                });
            }

            if (!btnHidden._listenerAdded) {
                btnHidden._listenerAdded = true;
                btnHidden.addEventListener('click', function() {
                    filterHiddenActive = !filterHiddenActive;
                    if (filterHiddenActive) {
                        btnHidden.classList.add('active');
                        btnAll.classList.remove('active');
                    } else {
                        btnHidden.classList.remove('active');
                    }
                    applyFiltersAndRender();
                });
            }
        }

        function applyFiltersAndRender() {
            var docs = window.__allDocs || [];

            if (currentSearchQuery) {
                docs = docs.filter(function(d) {
                    return (d.title && d.title.toLowerCase().includes(currentSearchQuery)) ||
                           (d.id && d.id.toLowerCase().includes(currentSearchQuery)) ||
                           (d.author && d.author.toLowerCase().includes(currentSearchQuery));
                });
            }

            var btnAllActive = document.getElementById('btnAll').classList.contains('active');

            docs = docs.filter(function(d) {
                var isCompleted = !!(d.completed || false);
                var isHidden = !!(d.hidden || false);

                if (btnAllActive || (!filterCompletedActive && !filterHiddenActive)) {
                    return true;
                }
                if (filterCompletedActive && filterHiddenActive) {
                    return isCompleted && isHidden;
                }
                if (filterCompletedActive) {
                    return isCompleted;
                }
                if (filterHiddenActive) {
                    return isHidden;
                }
                return true;
            });

            renderDocs(docs);
        }

        function openDoc(htmlPath) {
            if (htmlPath) window.open(htmlPath, '_blank');
        }

        function renderDocs(docs) {
            var container = document.getElementById('docsContainer');
            if (docs.length === 0) {
                container.innerHTML = '<p>No documents found.</p>';
                return;
            }

            var html = '';
            docs.forEach(function(doc) {
                var isCompleted = !!(doc.completed || false);
                var isHidden = !!(doc.hidden || false);
                var link = doc.html_path || '';

                html += '<div class="doc-item' + (isHidden ? ' hidden-doc' : '') + '" data-doc-id="' + doc.id + '" role="link" tabindex="0" onclick="openDoc(\'' + link + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openDoc(\'' + link + '\')}">' +
                    '<strong>ID:</strong> ' + doc.id + ' | ' +
                    '<strong>Title:</strong> ' + (doc.title || 'N/A') + ' | ' +
                    '<strong>Author:</strong> ' + (doc.author || 'N/A') + '<br>' +
                    '<span class="status-badge ' + (isCompleted ? 'completed-on">✓ مكتمل' : 'completed-off">○ قيد الترجمة') + '</span> ' +
                    '<span class="status-badge ' + (isHidden ? 'hidden-on">Hidden' : 'hidden-off">Visible') + '</span>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                if (window.__DOCUMENTS_DATA__) {
                    loadDocuments();
                } else {
                    setTimeout(loadDocuments, 100);
                }
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
            }
        });
    </script>
</body>
</html>
