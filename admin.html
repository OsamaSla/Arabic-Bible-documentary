<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 2rem;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        .login-title {
            text-align: center;
            color: var(--color-primary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .login-form .form-group {
            margin-bottom: 1rem;
        }
        .login-form label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .login-form input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            direction: rtl;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: var(--color-secondary);
        }
        .login-error {
            color: var(--color-error, #dc3545);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
        .login-hint {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-top"><div class="container">
            <a href="index.html" class="logo">
                <span class="cross">&#10013;</span>
                <span class="logo-text">Arabic Christian Documentary Translations</span>
            </a>
        </div></div>
    </header>
    
    <main>
        <div class="login-container">
            <h1 class="login-title">&#128274; Login</h1>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" value="admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div class="login-error" id="loginError">Invalid username or password</div>
            </form>
            <div class="login-hint">
                <a href="index.html">← Back to site</a>
            </div>
        </div>
    </main>
    
    <script>
        // Simple admin authentication using localStorage
        const adminUsername = 'admin';
        const adminPassword = 'admin123';
        const storageKey = 'admin_logged_in';
        
        // Check if user is already logged in
        function isLoggedIn() {
            return localStorage.getItem(storageKey) === 'true';
        }
        
        // Handle login form submission
        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === adminUsername && password === adminPassword) {
                // Store login state in localStorage (persists across sessions)
                localStorage.setItem(storageKey, 'true');
                window.location.href = 'admin-panel.html';
            } else {
                // Show error message
                document.getElementById('loginError').style.display = 'block';
            }
        }
        
        // Initialize - check login status on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                window.location.href = 'admin-panel.html';
            }
        });
    </script>
</body>
</html>
