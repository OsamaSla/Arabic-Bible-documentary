<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مواضيع متنوعة - تعليقات الكتاب المقدس">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gateway.umami.is; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>المواضيع - تعليقات الكتاب المقدس</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
    <script src="js/theme-init.js"></script>
    <style>
        .translations-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .translations-page h1 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--color-primary);
        }
        .filter-section {
            margin-bottom: 18px;
            background: transparent;
            border-bottom: none;
            padding: 0;
        }
        .books-list {
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 64px;
            padding: 14px 24px;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .books-list > .book-item:first-child {
            border-top: none;
        }
        .book-item:hover,
        .book-item.active {
            background: var(--bg-light);
        }
        .book-item:focus-visible,
        .book-doc-link:focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: -3px;
        }
        .book-item .book-name {
            font-size: var(--font-size-xl);
            font-weight: 700;
        }
        .book-badges {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .book-item .book-count {
            min-width: 92px;
            text-align: center;
            margin-top: 0;
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: 999px;
            padding: 4px 10px;
        }
        .book-item:hover .book-count,
        .book-item.active .book-count {
            color: var(--color-primary);
            border-color: var(--color-primary);
        }
        .book-chevron {
            font-size: 14px;
            color: var(--text-muted);
            transition: transform var(--transition-fast);
        }
        .book-item.active .book-chevron {
            transform: rotate(180deg);
        }
        .book-docs {
            display: none;
            background: var(--bg-light);
            border-top: 1px solid var(--border-light);
            border-radius: 0;
            margin-top: 0;
            padding: 4px 0;
        }
        .book-docs .book-doc-link {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 10px 28px;
            font-size: var(--font-size-base);
            color: var(--text-primary);
            text-decoration: none;
            border-bottom: 1px solid var(--border-light);
        }
        .book-docs .book-doc-link:last-child {
            border-bottom: none;
        }
        .book-doc-link:hover {
            color: var(--color-primary);
        }
        .book-docs .book-doc-link .doc-icon {
            flex-shrink: 0;
            font-size: 15px;
        }
        .book-docs .book-doc-link.in-progress .doc-icon {
            font-size: 9px;
        }
        .book-docs .book-doc-link .doc-title {
            flex: 1;
            min-width: 0;
        }
        .book-docs .book-doc-link .doc-author {
            flex-shrink: 0;
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        @media (max-width: 640px) {
            .book-item {
                min-height: 56px;
                padding: 12px 16px;
                gap: 10px;
            }
            .book-item .book-name {
                font-size: var(--font-size-lg);
            }
            .book-item .book-count {
                min-width: 76px;
            }
            .book-docs .book-doc-link {
                padding: 10px 18px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .book-item,
            .book-chevron {
                transition: none;
            }
        }
        .translations-stats {
            text-align: center;
            margin: -18px 0 26px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .translations-stats .stat-separator {
            margin: 0 8px;
            color: var(--border-light);
        }
        .translations-stats .stat-completed {
            color: var(--color-secondary);
        }
    </style>
    <script defer src="js/vendor/umami.js" data-website-id="4bf9e517-428f-466b-a83e-5873974e1e8f"></script>
</head>

        <nav class="nav-bar" id="navBar">

    <script src="js/data-visible.js"></script>
    <script src="js/dom.js"></script>

    <script src="js/translations.js"></script>
    <script src="js/search.js"></script>
