<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gateway.umami.is; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>نتائج البحث - الكتاب المقدس</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bibles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
    <script src="js/theme-init.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">تخطي إلى المحتوى الرئيسي</a>
    <header class="site-header">
        <div class="header-top">
            <div class="container">
                <a href="index.html" class="logo">
                    <span class="cross">&#10013;</span>
                    <span class="logo-text">ترجمات تعليقات الكتاب المقدس</span>
                </a>
                <div class="header-search">
                    <input type="text" id="searchInput" placeholder="ابحث..." autocomplete="off">
                    <span class="search-icon-btn">&#128269;</span>
                    <div class="search-results" id="searchResults"></div>
                </div>
                <div class="header-actions">
                    <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="تبديل المظهر">
                        <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
                        <span class="theme-icon-sun" aria-hidden="true">&#9728;</span>
                    </button>
                </div>
                <div class="nav-toggle" id="navToggle">
                    <span class="nav-toggle-open">&#9776;</span>
                    <span class="nav-toggle-close">&times;</span>
                </div>
            </div>
        </div>
        <nav class="nav-bar" id="navBar">
            <div class="container">
                <div class="nav-item">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                </div>
                <div class="nav-item">
                    <a href="bibles.html" class="nav-link">الكتاب المقدس</a>
                </div>
                <!-- MEGA_BAR prefix="" -->
                <div class="nav-item">
                    <a href="authors.html" class="nav-link">المؤلفون</a>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content" class="search-page">
        <div class="container">
            <div class="breadcrumb">
                <a href="index.html">الرئيسية</a>
                <span class="separator">&larr;</span>
                <span class="current">نتائج البحث</span>
            </div>
            <h1>نتائج البحث</h1>
            <form id="siteSearchForm" class="search-page-form" role="search" action="search.html" method="get">
                <label for="pageSearchInput">ابحث في عناوين التعليقات ونصوصها:</label>
                <div class="search-page-row">
                    <input type="search" id="pageSearchInput" name="q" autocomplete="off" minlength="2">
                    <button type="submit" class="search-page-btn">بحث</button>
                </div>
            </form>
            <p id="searchMeta" class="search-meta" role="status"></p>
            <div id="resultsList" class="results-list"></div>
            <noscript><p>يتطلب عرض نتائج البحث تفعيل JavaScript.</p></noscript>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div class="footer-brand">
                <p>تعليقات ومقالات الكتاب المقدس - للقراءة والدراسة والتنزيل مجاناً.</p>
            </div>
            <div>
                <h3>المحتوى</h3>
                <button type="button" data-href="index.html">الرئيسية</button>
                <button type="button" data-href="bibles.html">الكتاب المقدس</button>
                <button type="button" data-href="bible-index.html">الفهرس التفصيلي</button>
                <button type="button" data-href="translations.html">الترجمات</button>
                <button type="button" data-href="authors.html">المؤلفون</button>
            </div>
            <div>
                <h3>الخدمات</h3>
                <button type="button" data-href="index.html#recentUpdates">آخر التحديثات</button>
                <button type="button" data-href="index.html#newsletterForm">النشرة البريدية</button>
            </div>
            <div>
                <h3>حول</h3>
                <button type="button">ملاحظات</button>
                <button type="button">الشروط</button>
                <button type="button">الخصوصية</button>
            </div>
        </div>
        <div class="footer-bottom container">
            <span>© 2024 - 2026 ترجمات تعليقات الكتاب المقدس</span>
            <span>العربية</span>
        </div>
    </footer>

    <script src="js/data-visible.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/search.js"></script>
    <script src="js/search-page.js"></script>
</body>
</html>
