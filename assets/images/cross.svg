<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c5a03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a08030;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cross -->
  <rect x="40" y="10" width="20" height="80" rx="3" fill="url(#crossGradient)"/>
  <rect x="20" y="30" width="60" height="20" rx="3" fill="url(#crossGradient)"/>
  <!-- Decorative circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#1a3a5c" stroke-width="2" opacity="0.3"/>
</svg>
